<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#181512; --bg-2:#211D18; --ink:#F8F4EC; --accent:#FFC93C; --dim:rgba(248,244,236,0.6); --line:rgba(248,244,236,0.14); --font-head:'Fraunces',serif; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased;}
  .state{text-align:center; padding:120px 24px; color:var(--dim);}
  .wrap{max-width:720px; margin:0 auto; padding:50px 24px 70px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .kit-header{display:flex; align-items:center; gap:18px; margin-bottom:36px;}
  .avatar{width:64px; height:64px; border-radius:50%; background:var(--accent); color:var(--bg); display:flex; align-items:center; justify-content:center; font-family:var(--font-head); font-weight:800; font-size:24px; flex-shrink:0;}
  .kit-header h1{font-family:var(--font-head); font-weight:800; font-size:26px;}
  .kit-header .niche{color:var(--accent); font-size:12.5px; text-transform:uppercase; letter-spacing:0.6px; margin-top:2px;}
  .intro{color:var(--dim); font-size:14.5px; line-height:1.7; margin-bottom:40px; max-width:600px;}
  .kit-section{margin-bottom:40px; padding-top:30px; border-top:1px solid var(--line);}
  .kit-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; margin-bottom:16px;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .stat{background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center;}
  .stat-num{font-family:var(--font-head); font-weight:800; font-size:20px;}
  .stat-label{font-size:10.5px; color:var(--dim); margin-top:3px; text-transform:uppercase;}
  .brand-row{display:flex; flex-wrap:wrap; gap:10px;}
  .brand-pill{background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600;}
  .service-list{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .service-list li{background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:12px 16px; font-size:13.5px;}
  .kit-footer{text-align:center; padding-top:30px; border-top:1px solid var(--line);}
  .kit-footer a{color:var(--accent); text-decoration:none; font-weight:600; font-size:13.5px;}
  .empty{color:var(--dim); font-size:13px;}
  @media print{ body{background:#fff; color:#111;} }
</style>
</head>
<body>
<div id="loading" class="state">Loading media kit…</div>
<div id="notfound" class="state" style="display:none;">This media kit doesn't exist yet.</div>

<div class="wrap" id="content" style="display:none;">
  <div class="kit-header">
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <div class="niche" id="niche"></div>
    </div>
  </div>
  <p class="intro" id="intro"></p>

  <div class="kit-section">
    <div class="kit-label">Audience</div>
    <div class="stat-grid" id="statGrid"></div>
  </div>

  <div class="kit-section">
    <div class="kit-label">Past Brand Partnerships</div>
    <div class="brand-row" id="brandRow"></div>
  </div>

  <div class="kit-section">
    <div class="kit-label">Services</div>
    <ul class="service-list" id="serviceList"></ul>
  </div>

  <div class="kit-footer">
    <p style="color:var(--dim); font-size:12.5px; margin-bottom:8px;">Interested in working together?</p>
    <a id="contactLink" href="#">Get in touch →</a>
  </div>
</div>

<script>
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function safeUrl(u){
    if(!u) return '';
    try{
      const parsed = new URL(String(u), window.location.href);
      if(['http:','https:','mailto:'].includes(parsed.protocol)) return parsed.href;
    } catch(e){}
    return '';
  }

  async function load(){
    const params = new URLSearchParams(window.location.search);
    const username = params.get('u') || 'jordanellis';

    let profile = null;
    try{
      const res = await window.storage.get('thelab:users:' + username, false);
      profile = res ? JSON.parse(res.value) : null;
    } catch(e){ profile = null; }

    if(!profile){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notfound').style.display = 'block';
      return;
    }

    let deals = [];
    try{
      const res = await window.storage.get('thelab:deals:' + username, false);
      deals = res ? JSON.parse(res.value) : [];
    } catch(e){ deals = []; }

    if(profile.website && profile.website.theme){
      const t = profile.website.theme;
      const root = document.documentElement.style;
      root.setProperty('--bg', t.bg || '#181512');
      root.setProperty('--bg-2', t.bg2 || '#211D18');
      root.setProperty('--ink', t.ink || '#F8F4EC');
      root.setProperty('--accent', t.accent || '#FFC93C');
      root.setProperty('--font-head', t.font === 'sans' ? "'IBM Plex Sans',sans-serif" : "'Fraunces',serif");
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    const name = profile.displayName || profile.username;
    document.title = name + ' — Media Kit';
    document.getElementById('name').textContent = name;
    document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
    document.getElementById('niche').textContent = profile.niche || profile.goal || 'Content Creator';

    const kit = profile.mediaKit || {};
    document.getElementById('intro').textContent = kit.intro || profile.bio || '';

    const s = profile.stats || {};
    const statItems = [
      { num: s.followers || '—', label: 'Followers' },
      { num: s.views || '—', label: 'Total views' },
      { num: deals.length, label: 'Brand deals' },
      { num: s.years || '—', label: 'Years creating' },
    ];
    document.getElementById('statGrid').innerHTML = statItems.map(i =>
      `<div class="stat"><div class="stat-num">${esc(String(i.num))}</div><div class="stat-label">${i.label}</div></div>`
    ).join('');

    const brands = [...new Set(deals.filter(d => d.isPublic !== false).map(d => d.brand))];
    document.getElementById('brandRow').innerHTML = brands.length
      ? brands.map(b => `<div class="brand-pill">${esc(b)}</div>`).join('')
      : '<div class="empty">No public partnerships yet.</div>';

    const services = kit.services || [];
    document.getElementById('serviceList').innerHTML = services.length
      ? services.map(sv => `<li>${esc(sv)}</li>`).join('')
      : '<li class="empty" style="background:none; border:none; padding:0;">No services listed yet.</li>';

    const email = (profile.social && profile.social.email) || profile.email;
    document.getElementById('contactLink').href = email ? 'mailto:' + email : 'portfolio.html?u=' + encodeURIComponent(username);
  }

  load();
</script>
</body>
</html>
